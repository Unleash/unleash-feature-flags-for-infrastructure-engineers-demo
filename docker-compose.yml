services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: unleash
      POSTGRES_USER: unleash
      POSTGRES_PASSWORD: unleash
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unleash"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  unleash:
    image: unleashorg/unleash-enterprise:8.0.4
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4242:4242"
    environment:
      DATABASE_URL: postgres://unleash:unleash@postgres:5432/unleash
      DATABASE_SSL: "false"
      UNLEASH_LICENSE: ${UNLEASH_LICENSE}
      INIT_ADMIN_API_TOKENS: ${UNLEASH_ADMIN_TOKEN}
      INIT_BACKEND_API_TOKENS: ${UNLEASH_BACKEND_TOKEN}
      UNLEASH_EXPERIMENTAL_IMPACT_METRICS_FLAG_PAGE: "true"
      UNLEASH_EXPERIMENTAL_REGISTER_IMPACT_METRICS: "true"
      UNLEASH_EXPERIMENTAL_MULTI_METRIC_CHART: "true"
      UNLEASH_EXPERIMENTAL_STREAMING: "true"
      UNLEASH_EXPERIMENTAL_DELTA_API: "true"
      PROMETHEUS_IMPACT_METRICS_API: http://prometheus-internal-impact-metrics:9090
      EXTERNAL_PROMETHEUS_IMPACT_METRICS_API: http://prometheus:9090
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4242/health"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  api:
    build: ./backend
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      unleash:
        condition: service_healthy
    environment:
      UNLEASH_URL: http://unleash:4242/api/
      UNLEASH_BACKEND_TOKEN: ${UNLEASH_BACKEND_TOKEN}
      HEALTHY_SECONDS: ${HEALTHY_SECONDS:-30}
      RAMP_SECONDS: ${RAMP_SECONDS:-30}
      MAX_DELAY_MS: ${MAX_DELAY_MS:-12000}
      IDLE_RESET_SECONDS: ${IDLE_RESET_SECONDS:-30}
      DROP_DELAY_MS: ${DROP_DELAY_MS:-1000}

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  prometheus-internal-impact-metrics:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./prometheus/prometheus-internal-impact-metrics.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-internal-impact-metrics-data:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  wrk2:
    profiles: ["load-test"]
    build: ./loadtest

volumes:
  pgdata:
  prometheus-data:
  prometheus-internal-impact-metrics-data:
  grafana-data:
